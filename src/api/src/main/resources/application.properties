spring.application.name=inqcust-api
app.lookup.random-retry-limit=1000

# Data mode switch: use 'mock' for JSON file data (default) or 'db' for relational DB.
app.data.mode=mock
app.mock-data.path=mock-data/customer-records.json

# DB mode settings (used only when app.data.mode=db).
app.db.url=${APP_DB_URL:}
app.db.username=${APP_DB_USERNAME:}
app.db.password=${APP_DB_PASSWORD:}
app.db.table-name=CUSTOMER

# Connection pool settings for DB mode.
app.db.pool.max-size=10
app.db.pool.min-idle=2
app.db.pool.connection-timeout-ms=30000
app.db.pool.idle-timeout-ms=600000
app.db.pool.max-lifetime-ms=1800000

# Operational visibility for production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
